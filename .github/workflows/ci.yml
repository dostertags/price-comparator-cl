name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tipos
        run: mypy
      - name: Tests (sin red) con cobertura
        run: pytest --cov=price_comparator --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Bandit
        run: bandit -q -r src
      - name: Dependencias con vulnerabilidades conocidas
        run: pip-audit -r requirements.txt
      - name: Secretos
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
